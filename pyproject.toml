[project]
name = "neomyth"
version = "0.1.0"
description = "Multi-module AI monorepo — voice assistant with microservice workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "httpx>=0.28",
    "langgraph>=0.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    # Pinned <1.0: the 1.x line pulls onnxruntime/numpy (local layout model),
    # which the repo rule keeps out of api/ and modules/.
    "pymupdf4llm>=0.0.20,<1.0",
    "jsonschema>=4.23",
]

[project.scripts]
neomyth-api = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "modules"]

[tool.uv]
package = true
