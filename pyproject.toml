[project]
name = "neomyth"
version = "0.1.0"
description = "Multi-module AI monorepo — voice assistant with microservice workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "httpx>=0.28",
    "jinja2>=3.1",
    "langgraph>=0.2",
]

[project.scripts]
neomyth-api = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "modules"]

[tool.uv]
package = true
