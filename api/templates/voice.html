<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neomyth Voice</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6c9eff;
      --listening: #34d399;
      --thinking: #fbbf24;
      --speaking: #a78bfa;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: min(520px, 100%);
      background: var(--surface);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.25rem; font-size: .9rem; }
    .status-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.listening { background: var(--listening); }
    .dot.thinking { background: var(--thinking); }
    .dot.speaking { background: var(--speaking); }
    .metrics {
      display: flex;
      gap: 1rem;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .metrics strong { color: var(--text); }
    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: .9rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0f1117;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.stop { background: var(--error); color: #fff; margin-top: .5rem; }
    .transcript {
      margin-top: 1.25rem;
      padding: 1rem;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      min-height: 120px;
      font-size: .92rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
    .error { color: var(--error); margin-top: .75rem; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Neomyth Voice</h1>
    <p class="subtitle">Real-time STT → LLM → TTS{% if interrupt_enabled %} with interruption{% endif %}</p>

    <div class="status-row">
      <div id="phaseDot" class="dot"></div>
      <div id="phaseLabel">Disconnected</div>
    </div>

    <div class="metrics">
      <div>Latency: <strong id="latency">—</strong></div>
      <div>WS: <strong id="wsStatus">off</strong></div>
      <div>Interrupt: <strong id="interruptStatus">{{ "on" if interrupt_enabled else "off" }}</strong></div>
    </div>

    <button id="startBtn">Start Session</button>
    <button id="stopBtn" class="stop" disabled>Stop Session</button>

    <div class="transcript" id="transcript" aria-live="polite"></div>
    <div class="error" id="error"></div>
  </div>

  <script>
    window.NEOMYTH_VOICE = { interruptEnabled: {{ "true" if interrupt_enabled else "false" }} };
  </script>
  <script src="/static/voice-client.js"></script>
</body>
</html>
