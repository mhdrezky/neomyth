services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neomyth-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neomyth}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg-data:
