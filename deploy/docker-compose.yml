# Root orchestration — use profiles to start subsets
#
# Default workers:     docker compose --profile workers up -d        (tiny STT :5002)
# Large-v3 STT stack:  docker compose --profile stt-large up -d   (large STT :5004)
# Full stack:          docker compose --profile full up -d

services:
  vllm-llm:
    profiles: [workers, full]
    image: vllm/vllm-openai:latest
    container_name: vllm-llm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-5001}:8000"
    env_file:
      - ./vllm-llm/.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    shm_size: "2gb"
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3.5-0.8B}
      - --served-model-name
      - ${VLLM_MODEL_ALIAS:-qwen-3.5}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whisper-stt:
    profiles: [workers, full]
    build: ./whisper-stt
    container_name: whisper-stt
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-5002}:8000"
    env_file:
      - ./whisper-stt/.env
    volumes:
      - whisper-cache:/root/.cache

  whisper-large-v3:
    profiles: [stt-large, workers-large]
    build: ./whisper-large-v3
    container_name: whisper-large-v3
    restart: unless-stopped
    ports:
      - "${WHISPER_LARGE_PORT:-5004}:8000"
    env_file:
      - ./whisper-large-v3/.env
    volumes:
      - whisper-large-cache:/root/.cache
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  kokoro-tts:
    profiles: [workers, full]
    build: ./kokoro-tts
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "${KOKORO_PORT:-5003}:8000"
    env_file:
      - ./kokoro-tts/.env
    volumes:
      - kokoro-cache:/root/.cache

  postgres:
    profiles: [db, workers, full]
    image: pgvector/pgvector:pg16
    container_name: neomyth-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - ./postgres/.env
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neomyth}"]
      interval: 5s
      timeout: 3s
      retries: 5

  neomyth-api:
    profiles: [full]
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    container_name: neomyth-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5000
      VLLM_BASE_URL: http://vllm-llm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL_ALIAS:-qwen-3.5}
      STT_BASE_URL: http://whisper-stt:8000
      TTS_BASE_URL: http://kokoro-tts:8000
      TTS_VOICE: ${KOKORO_VOICE:-af_sarah}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neomyth}:${POSTGRES_PASSWORD:-neomyth}@postgres:5432/${POSTGRES_DB:-neomyth}
    depends_on:
      postgres:
        condition: service_healthy
      vllm-llm:
        condition: service_started
      whisper-stt:
        condition: service_started
      kokoro-tts:
        condition: service_started

volumes:
  pg-data:
  hf-cache:
  whisper-cache:
  whisper-large-cache:
  kokoro-cache:
